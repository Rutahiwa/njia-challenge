<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Njia Ops</title>
<style>
  :root {
    --bg: #0e1116; --panel: #151a21; --line: #232a34; --ink: #e6e9ef;
    --dim: #8b94a3; --accent: #4ea1ff; --good: #3fb950; --bad: #f85149; --warn: #d29922;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 14px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .chip {
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px;
  }
  .chip b { color: var(--ink); font-weight: 600; }
  main { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 57px); }
  aside { border-right: 1px solid var(--line); overflow-y: auto; }
  .run {
    padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .run:hover { background: var(--panel); }
  .run[aria-selected="true"] { background: var(--panel); box-shadow: inset 2px 0 0 var(--accent); }
  .run .who { font-weight: 600; }
  .run .meta { color: var(--dim); font-size: 12px; }
  section { overflow-y: auto; padding: 20px 24px; }
  .empty { color: var(--dim); padding: 48px 0; text-align: center; }
  .step {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
    margin-bottom: 10px; background: var(--panel);
  }
  .step .head { display: flex; gap: 10px; align-items: baseline; }
  .step .name { font-weight: 600; }
  .step .ms { color: var(--dim); font-size: 12px; margin-left: auto; }
  pre {
    margin: 8px 0 0; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim); white-space: pre-wrap; word-break: break-word;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.llm { background: var(--accent); } .dot.tool { background: var(--warn); }
  button {
    font: inherit; color: var(--ink); background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .todo {
    border: 1px dashed var(--warn); color: var(--warn); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 16px; font-size: 13px;
  }
  .taken-over-badge {
    display: inline-block; background: var(--bad); color: #fff; font-size: 11px;
    font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px;
    vertical-align: middle; letter-spacing: .3px;
  }
  .run .taken-label { color: var(--bad); font-size: 11px; font-weight: 600; }
  #takeover.active { border-color: var(--bad); color: var(--bad); }
  .stream-status {
    color: var(--dim); font-size: 12px; padding: 6px 0 10px; display: flex;
    align-items: center; gap: 6px;
  }
  .stream-status .live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--good);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .3; }
  }
</style>
</head>
<body>
<header>
  <h1>Njia Ops</h1>
  <span class="chip">tool calls <b id="calls">-</b>/12</span>
  <span class="chip">input tokens <b id="tokens">-</b>/25k</span>
  <button id="takeover" style="margin-left:auto">Take over</button>
</header>

<main>
  <aside id="runs"></aside>
  <section id="detail">
    <div class="empty">Pick a run.</div>
  </section>
</main>

<script>
let selected = null;
let eventSource = null;
let takenOverSet = new Set();

async function loadRuns() {
  try {
    const { runs } = await (await fetch('/runs')).json();
    const list = document.getElementById('runs');

    // Track which conversations are taken over
    runs.forEach(r => { if (r.taken_over) takenOverSet.add(r.conversation_id); });

    list.innerHTML = runs.reverse().map(r => `
      <div class="run" data-id="${r.run_id}" aria-selected="${r.run_id === selected}">
        <div class="who">${escapeHtml(r.conversation_id)}${
          r.taken_over ? '<span class="taken-over-badge">TAKEN OVER</span>' : ''
        }</div>
        <div class="meta">${r.status} &middot; ${r.budget.tool_calls} calls${
          r.taken_over ? ' <span class="taken-label">human control</span>' : ''
        }</div>
      </div>`).join('') || '<div class="empty">No runs yet.</div>';

    list.querySelectorAll('.run').forEach(el =>
      el.onclick = () => {
        if (selected === el.dataset.id) return;
        selected = el.dataset.id;
        subscribeToRun(selected);
        loadRuns();
      });
  } catch (e) {
    console.error('loadRuns error:', e);
  }
}

function subscribeToRun(runId) {
  // Close any existing EventSource
  if (eventSource) {
    eventSource.close();
    eventSource = null;
  }

  const detail = document.getElementById('detail');
  detail.innerHTML = '<div class="stream-status"><span class="live-dot"></span> Connecting...</div>';

  eventSource = new EventSource(`/runs/${runId}/events`);

  let stepCount = 0;

  eventSource.addEventListener('step', (e) => {
    const step = JSON.parse(e.data);
    stepCount++;

    // On first step, clear the status line (but keep it at top)
    if (stepCount === 1) {
      detail.innerHTML = '<div class="stream-status"><span class="live-dot"></span> Streaming</div>';
    }

    const div = document.createElement('div');
    div.className = 'step';
    div.innerHTML = `
      <div class="head">
        <span class="dot ${step.type || ''}"></span>
        <span class="name">${escapeHtml(step.name || step.model || step.type || '')}</span>
        <span class="ms">${step.ms ? step.ms + 'ms' : ''}</span>
      </div>
      <pre>${escapeHtml(JSON.stringify(step.output ?? step.content ?? '', null, 1)).slice(0, 900)}</pre>`;
    detail.appendChild(div);
    detail.scrollTop = detail.scrollHeight;

    // Update budget counters from step data
    updateBudgetFromStep(step);
  });

  eventSource.addEventListener('done', (e) => {
    const info = JSON.parse(e.data);
    const statusEl = detail.querySelector('.stream-status');
    if (statusEl) {
      statusEl.innerHTML = `Run ${info.status}`;
      statusEl.querySelector('.live-dot')?.remove();
    }
    eventSource.close();
    eventSource = null;
    // Refresh run list to get final state
    loadRuns();
  });

  eventSource.onerror = () => {
    const statusEl = detail.querySelector('.stream-status');
    if (statusEl) {
      statusEl.innerHTML = 'Connection lost';
    }
    eventSource.close();
    eventSource = null;
  };
}

let budgetCalls = 0;
let budgetTokens = 0;

function updateBudgetFromStep(step) {
  if (step.type === 'tool' && step.output) {
    budgetCalls++;
  }
  if (step.type === 'llm') {
    budgetTokens += (step.input_tokens || 0);
  }
  document.getElementById('calls').textContent = budgetCalls;
  document.getElementById('tokens').textContent = budgetTokens;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

document.getElementById('takeover').onclick = async () => {
  if (!selected) return;
  const btn = document.getElementById('takeover');
  try {
    const resp = await fetch(`/runs/${selected}/takeover`, { method: 'POST' });
    const data = await resp.json();
    if (data.taken_over) {
      takenOverSet.add(data.conversation_id);
      btn.classList.add('active');
      btn.textContent = 'Taken over';
      loadRuns();
    }
  } catch (e) {
    console.error('takeover error:', e);
  }
};

// Poll the run list (sidebar) every 2 seconds
setInterval(loadRuns, 2000);
loadRuns();
</script>
</body>
</html>
